<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>SIPADES - Admin Desa</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>🏛️ SIPADES — Admin Desa</h1>
  <button class="logout" onclick="logout()">Logout</button>
</header>
<main class="container">
  <section class="card">
    <h2>🔍 Verifikasi Berkas</h2>
    <table>
      <thead>
        <tr><th>ID</th><th>Warga</th><th>Jenis</th><th>Berkas</th><th>Status</th><th>Aksi</th></tr>
      </thead>
      <tbody id="tabel"></tbody>
    </table>
  </section>
</main>

<script src="js/models.js"></script>
<script src="js/repository.js"></script>
<script src="js/service.js"></script>
<script>
  const admin = new AdminDesa('A001', 'Admin Desa', 'admin');

  function render() {
    const list = PengajuanRepository.all();
    tabel.innerHTML = list.map(p => `
      <tr>
        <td>${p.id.slice(-6)}</td>
        <td>${p.warga.nama}</td>
        <td>${p.jenisSurat.nama}</td>
        <td>${p.berkas.join(', ')}</td>
        <td><span class="badge ${p.status.toLowerCase()}">${p.status}</span></td>
        <td>
          ${p.status === 'MENUNGGU_VERIFIKASI'
            ? `<button class="success" onclick="verif('${p.id}')">Verifikasi</button>`
            : '—'}
        </td>
      </tr>
    `).join('') || '<tr><td colspan="6">Belum ada pengajuan.</td></tr>';
  }

  function verif(id) {
    try {
      const raw = PengajuanRepository.findById(id);
      const pengajuan = Object.assign(new PengajuanSurat(), raw);
      admin.prosesPengajuan(pengajuan);
      PengajuanRepository.update(id, { status: pengajuan.status, verifikator: pengajuan.verifikator });
      alert('✅ Berkas diverifikasi. Menunggu persetujuan Kepala Desa.');
      render();
    } catch (e) { alert('❌ ' + e.message); }
  }

  function logout() { sessionStorage.clear(); location.href='index.html'; }
  render();
</script>
</body>
</html>
